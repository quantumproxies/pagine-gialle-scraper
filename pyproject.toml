[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quanticdata-pagine-gialle-scraper"
version = "0.1.0"
description = "Pagine Gialle scraper for Python and the command line: Italian businesses for a category and a comune, with the email the owner registered, Partita IVA, verified phone, website, opening hours and address, plus Pagine Bianche listings, as JSON or CSV. Free and open source; sign in with your QuanticData account, no proxies or headless browser to run."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "QuanticData", email = "hello@quanticdata.io" }]
keywords = ["pagine-gialle-scraper", "pagine-gialle", "paginegialle", "pagine-bianche", "business-directory", "italy", "italian-companies", "partita-iva", "lead-generation", "local-business", "yellow-pages", "web-scraping"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.3"]

[project.scripts]
pagine-gialle-scraper = "quanticdata_pagine_gialle_scraper.__main__:run"

[project.urls]
Homepage = "https://quanticdata.io/collectors/?utm_source=github&utm_medium=pypi&utm_campaign=pagine-gialle-scraper"
Documentation = "https://quanticdata.io/docs/"
Source = "https://github.com/quantumproxies/pagine-gialle-scraper"
Issues = "https://github.com/quantumproxies/pagine-gialle-scraper/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"quanticdata_pagine_gialle_scraper" = ["spec.json", "py.typed"]
